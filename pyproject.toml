[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonsite"
version = "1.0.0"
description = "AnonSite — navegador anônimo em Python puro (PyQt6 + QtWebEngine), Linux e Windows"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "PyQt6-WebEngine>=6.5",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anonsite = "anonsite.__main__:main"

[tool.setuptools.packages.find]
include = ["anonsite*"]
